# Continuous integration.
#
# Runs on every push to main and every pull request. The grading rubric's repo
# standard expects CI, and more practically: this is what stops someone merging
# a branch that does not compile, which in a 4-person team costs everyone an
# afternoon.
#
# It does NOT need any Firebase secrets -- see the dummy env values below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies. Faster and
      # more reproducible than `npm install` on a build machine.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # lib/firebase.ts throws when config is missing, and `next build`
      # pre-renders pages, so the build needs *some* value for each variable.
      # These are deliberately fake: CI only checks that the code compiles and
      # renders, it never talks to Firebase.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ciplaceholder"
